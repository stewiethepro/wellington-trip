    .card.clickable { cursor: pointer; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }

    .tab-btn { padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: all 120ms ease; }
    .tab-btn[data-active="true"] { background: var(--teal); color: var(--cream); }
    .tab-btn[data-active="false"] { color: var(--ink-soft); }
    .tab-btn[data-active="false"]:hover { background: var(--cream-deep); }

    .chip { padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
      background: #fff; border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; transition: all 120ms ease; }
    .chip[data-active="true"] { background: var(--teal); border-color: var(--teal); color: var(--cream); }
    .chip[data-active="false"]:hover { background: var(--cream-deep); }

    .timeline-rail { position: absolute; left: 28px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
    .timeline-dot { position: absolute; left: 20px; width: 18px; height: 18px; border-radius: 999px;
      background: #fff; border: 2px solid var(--teal); }

    .place-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%); }
    .place-img-sm { aspect-ratio: 4/3; }

    .fav-btn {
      position: absolute; top: 10px; right: 10px; width: 36px; height: 36px;
      border-radius: 999px; background: rgba(255,255,255,0.95);
      border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; line-height: 1; transition: transform 100ms;
    }
    .fav-btn:hover { transform: scale(1.08); }

    .checkitem {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer;
      border-bottom: 1px dashed var(--line); user-select: none;
    }
    .checkitem:last-child { border-bottom: none; }
    .checkitem input[type=checkbox] { margin-top: 3px; cursor: pointer; accent-color: var(--teal); width: 16px; height: 16px; }
    .checkitem.done .label { text-decoration: line-through; color: var(--ink-mute); }

    .scrim { position: fixed; inset: 0; background: rgba(15,30,29,0.55); z-index: 50; opacity: 0;
      pointer-events: none; transition: opacity 160ms ease; }
    .scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

    .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--cream);

    const TRIP_DATES = ["2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01"];
    const DAY_LABEL = { "2026-05-29": "Fri", "2026-05-30": "Sat", "2026-05-31": "Sun", "2026-06-01": "Mon" };
    const WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=-41.2924&longitude=174.7787&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,weather_code&timezone=Pacific%2FAuckland&forecast_days=16";

    function WeatherWidget() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [fetchedAt, setFetchedAt] = useState(null);
      const [loading, setLoading] = useState(true);
      const load = useCallback(async (force) => {
        try {
          setLoading(true);
          const cached = localStorage.getItem("wlg-weather-v1");
          if (!force && cached) {
            const parsed = JSON.parse(cached);
            const age = Date.now() - parsed.at;
            if (age < 12 * 60 * 60 * 1000) {
              setData(parsed.data); setFetchedAt(parsed.at); setLoading(false); return;
            }
          }
          const res = await fetch(WEATHER_URL);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();
          const at = Date.now();
          localStorage.setItem("wlg-weather-v1", JSON.stringify({ data: json, at }));
          setData(json); setFetchedAt(at); setError(null);
        } catch (e) {
          const cached = localStorage.getItem("wlg-weather-v1");
          if (cached) { const parsed = JSON.parse(cached); setData(parsed.data); setFetchedAt(parsed.at); }
          setError(e.message || "Couldn't reach Open-Meteo");
        } finally { setLoading(false); }
      }, []);
      useEffect(() => {
        load(false);
        const id = setInterval(() => load(true), 6 * 60 * 60 * 1000);
        return () => clearInterval(id);
      }, [load]);
      const days = useMemo(() => {
        if (!data || !data.daily) return [];
        const { time, temperature_2m_max, temperature_2m_min, precipitation_probability_max, precipitation_sum, wind_speed_10m_max, weather_code } = data.daily;
        return time.map((d, i) => ({ date: d, tmax: temperature_2m_max[i], tmin: temperature_2m_min[i],
          pop: precipitation_probability_max[i], precip: precipitation_sum[i],
          wind: wind_speed_10m_max[i], code: weather_code[i] })).filter(d => TRIP_DATES.includes(d.date));
      }, [data]);
      const updated = fetchedAt ? new Date(fetchedAt).toLocaleString("en-NZ", { dateStyle: "medium", timeStyle: "short" }) : null;
      return (
        <section className="mb-8">
          <div className="flex items-baseline justify-between mb-3">
            <h2 className="serif text-2xl teal">Wellington forecast</h2>
            <div className="text-xs ink-mute flex items-center gap-3">
              {updated && <span>Updated {updated}</span>}
              <button onClick={() => load(true)} className="link-underline">refresh</button>
            </div>
          </div>
          {loading && !days.length && <div className="card p-5 text-sm ink-soft">Loading forecast from Open-Meteo…</div>}
          {error && !days.length && (
            <div className="card p-5 text-sm">
              <div className="font-semibold ink">Couldn't reach Open-Meteo.</div>
              <div className="ink-soft mt-1">If you opened this file by double-clicking, run <span className="mono">python3 -m http.server</span> in this folder and open <span className="mono">http://localhost:8000</span> instead.</div>
            </div>
          )}
          {days.length > 0 && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {days.map(d => {
                const code = WMO_CODES[d.code] || { label: "—", icon: "·" };
                return (
                  <div key={d.date} className="card p-4">
                    <div className="flex items-baseline justify-between">
                      <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">{DAY_LABEL[d.date]} · {d.date.slice(5)}</div>
                      <div className="text-2xl">{code.icon}</div>
                    </div>
                    <div className="serif text-xl ink mt-2">{Math.round(d.tmax)}° <span className="ink-mute text-base">/ {Math.round(d.tmin)}°</span></div>
                    <div className="text-xs ink-soft mt-1">{code.label}</div>
                    <div className="text-xs ink-mute mt-2">
                      <div>Rain · {d.pop ?? 0}%</div>
                      <div>Wind · {Math.round(d.wind)} km/h</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    /* ================================================================ */
    /* SHARED                                                              */
    /* ================================================================ */

    const KIND = {
      wake: { label: "wake", bg: "var(--cream-deep)", fg: "var(--ink-soft)" },
      logistics: { label: "logistics", bg: "var(--cream-deep)", fg: "var(--ink-soft)" },
      drive: { label: "drive", bg: "var(--cream-deep)", fg: "var(--teal-deep)" },
      fly: { label: "fly", bg: "var(--cream-deep)", fg: "var(--teal-deep)" },
      food: { label: "food", bg: "var(--gold-soft)", fg: "var(--gold)" },
      activity: { label: "activity", bg: "var(--coral-soft)", fg: "var(--teal-deep)" },
      stay: { label: "stay", bg: "var(--cream-deep)", fg: "var(--ink-soft)" },
      wind: { label: "wind down", bg: "var(--cream-deep)", fg: "var(--ink-soft)" },
      birthday: { label: "birthday", bg: "var(--coral)", fg: "#fff" },
    };
    function Pill({ kind }) {
      const k = KIND[kind] || KIND.logistics;
      return <span className="pill" style={{ background: k.bg, color: k.fg }}>{k.label}</span>;
    }
    function Price({ level }) {
      const d = "$".repeat(level || 1); const g = "$".repeat(4 - (level || 1));
      return <span className="mono text-sm"><span style={{ color: "var(--teal)" }}>{d}</span><span style={{ color: "var(--ink-mute)" }}>{g}</span></span>;
    }
    function PlaceImg({ src, alt, name, small }) {
      const [err, setErr] = useState(false);
      if (err || !src) {
        return (
          <div className={`place-img ${small ? "place-img-sm" : ""}`} style={{ position: "relative" }} aria-label={alt}>
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "rgba(247,241,230,0.85)", fontFamily: "Fraunces, serif", fontSize: small ? 16 : 22, padding: 24, textAlign: "center" }}>
              {name || alt}
            </div>
          </div>
        );
      }
      return <img src={src} alt={alt} className={`place-img ${small ? "place-img-sm" : ""}`} loading="lazy" onError={() => setErr(true)} />;
    }

    function getSwapCandidates(swapKind) {
      const all = Object.values(PLACES);
      if (swapKind === "breakfast") return all.filter(p => p.meal && p.meal.includes("breakfast"));
      if (swapKind === "lunch") return all.filter(p => p.meal && p.meal.includes("lunch"));
      if (swapKind === "dinner") return all.filter(p => p.meal && p.meal.includes("dinner"));
      if (swapKind === "dinner-occasion") return all.filter(p => p.meal && p.meal.includes("dinner") && p.kidFriendly !== false);
      if (swapKind === "activity") return all.filter(p => p.kind === "activity");
      return [];
    }

    /* Sort places: favourites first */
    function sortByFavourites(places, favourites) {
      return [...places].sort((a, b) => {
        const fa = favourites.has(a.id) ? 1 : 0;
        const fb = favourites.has(b.id) ? 1 : 0;
        return fb - fa;
      });
    }

    /* ================================================================ */
    /* ENTRY                                                               */
    /* ================================================================ */

    function Entry({ entry, picks, onOpen, onSwap, onResetPick }) {
      const userPickId = picks[entry.id];
      const defaultPlaceId = entry.placeRef || (entry.options && entry.options[0]);
      const currentPlaceId = userPickId || defaultPlaceId;
      const place = currentPlaceId ? P(currentPlaceId) : null;
      const isBirthday = entry.kind === "birthday";
      const isOverridden = userPickId && userPickId !== defaultPlaceId;
      const canSwap = !!entry.swapKind;
      const cardClick = () => {
        if (place) onOpen({ type: "place", place });
        else if (entry.place) onOpen({ type: "place", place: { name: entry.place.name, address: entry.place.name, blurb: entry.body || "" } });
      };
      return (
        <div className="relative pl-12 pb-5">
          <div className="timeline-dot" style={{ top: 6, borderColor: isBirthday ? "var(--coral)" : (isOverridden ? "var(--coral)" : "var(--teal)") }} />
          <div className={`card ${place || entry.place ? "clickable" : ""}`}
               style={isBirthday ? { boxShadow: "0 0 0 2px var(--coral)" } : null}
               onClick={place || entry.place ? cardClick : undefined}>
            {place && place.img && <PlaceImg src={place.img} alt={place.name} name={place.name} />}
            <div className="p-4">
              <div className="flex flex-wrap items-center gap-2 mb-1">
                <span className="mono text-sm" style={{ color: "var(--teal-deep)" }}>{entry.time}</span>
                <Pill kind={entry.kind} />
                {place && <span className="text-xs ink-mute">{place.category}</span>}
                {isOverridden && <span className="pill" style={{ background: "var(--coral-soft)", color: "var(--teal-deep)" }}>your pick</span>}
              </div>
              <div className="serif text-lg ink leading-snug">{entry.title}</div>
              {place && (
                <div className="text-sm mt-1">
                  <span style={{ color: "var(--teal)" }} className="font-medium">{place.name}</span>
                  <span className="ink-mute"> · </span>
                  <a href={url(place.address || place.name)} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="ink-soft link-underline">map</a>
                  {place.website && <>
                    <span className="ink-mute"> · </span>
                    <a href={place.website} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="ink-soft link-underline">website</a>
                  </>}
                </div>
              )}
              {entry.place && !place && (
                <a href={url(entry.place.q)} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="text-sm teal link-underline inline-block mt-1">{entry.place.name} · map</a>
              )}
              {entry.body && <p className="mt-2 text-sm ink-soft leading-relaxed">{entry.body}</p>}
              {entry.tip && (
                <div className="mt-3 text-xs ink-soft bg-cream-deep border border-line rounded-md px-3 py-2">
                  <span className="font-semibold ink">Note · </span>{entry.tip}
                </div>
              )}
              {canSwap && (
                <div className="mt-3 flex flex-wrap items-center gap-3 text-xs">
                  <button onClick={(e) => { e.stopPropagation(); onSwap(entry); }} className="px-3 py-1.5 rounded-md border border-line bg-cream-deep ink hover:border-line-strong font-medium">Swap →</button>
                  {isOverridden && <button onClick={(e) => { e.stopPropagation(); onResetPick(entry.id); }} className="ink-soft link-underline">Reset to default</button>}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Day({ day, picks, onOpen, onSwap, onResetPick }) {
      return (
        <section>
          <div className="mb-6">
            <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">{day.label}</div>
            <h2 className="serif text-3xl md:text-4xl teal mt-1">{day.title}</h2>
            <div className="flex flex-wrap gap-x-5 gap-y-1 mt-2 text-xs ink-soft">
              <div>Sunrise {day.sun.rise} · Sunset {day.sun.set}</div>
            </div>
          </div>
          <div className="relative">
            <div className="timeline-rail" />
            {day.entries.map(e => <Entry key={e.id} entry={e} picks={picks} onOpen={onOpen} onSwap={onSwap} onResetPick={onResetPick} />)}
          </div>
        </section>
      );
    }

    /* ================================================================ */
    /* PLACE CARD with favourite heart                                     */
    /* ================================================================ */

    function PlaceCard({ place, onOpen, selected, small, isFavourite, onToggleFavourite }) {
      return (
        <div className={`card clickable ${selected ? "ring-teal" : ""}`} style={{ position: "relative" }} onClick={() => onOpen(place)}>
          <PlaceImg src={place.img} alt={place.name} name={place.name} small={small} />
          {onToggleFavourite && (
            <button className="fav-btn" onClick={(e) => { e.stopPropagation(); onToggleFavourite(place.id); }}
                    aria-label={isFavourite ? "Remove from favourites" : "Add to favourites"}
                    title={isFavourite ? "Remove from favourites" : "Add to favourites"}>
              {isFavourite ? <span style={{ color: "var(--coral)" }}>♥</span> : <span style={{ color: "var(--ink-mute)" }}>♡</span>}
            </button>
          )}
          <div className="p-4">
            <div className="flex items-center justify-between gap-2">
              <div className="text-xs ink-mute">{place.category}</div>
              {place.priceLevel ? <div className="mono text-sm ink-soft">{place.priceLevel}</div> : place.price && <Price level={place.price} />}
            </div>
            <div className="serif text-lg ink mt-1 leading-snug">{place.name}</div>
            <div className="text-sm ink-soft mt-1">{place.blurb}</div>
            <div className="mt-2 flex flex-wrap gap-1">
              {place.homeStyle && <span className="pill" style={{ background: "var(--sage)", color: "#fff" }}>eat in</span>}
              {place.takeaway && <span className="pill" style={{ background: "var(--gold)", color: "#fff" }}>takeaway</span>}
              {place.kidFriendly && <span className="pill" style={{ background: "var(--sage-soft)", color: "var(--teal-deep)" }}>kid-friendly</span>}
              {place.occasion && <span className="pill" style={{ background: "var(--coral-soft)", color: "var(--teal-deep)" }}>occasion</span>}
              {place.booking && place.booking.toLowerCase().includes("walk-in") && (
                <span className="pill" style={{ background: "var(--gold-soft)", color: "var(--gold)" }}>walk-in only</span>
              )}
              {selected && <span className="pill" style={{ background: "var(--teal)", color: "#fff" }}>current pick</span>}
            </div>
          </div>
        </div>
      );
    }

    /* ================================================================ */
    /* DETAIL SHEET                                                        */
    /* ================================================================ */

    function DetailSheet({ open, payload, onClose, onOpen, picks, onPickForEntry, favourites, onToggleFavourite }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [onClose]);
      const place = payload && payload.type === "place" ? payload.place : null;
      const swap = payload && payload.type === "swap" ? payload : null;

      let swapCandidates = [];
      let currentForSwap = null;
      if (swap) {
        swapCandidates = getSwapCandidates(swap.entry.swapKind);
        const userPickId = picks[swap.entry.id];
        const defaultPlaceId = swap.entry.placeRef || (swap.entry.options && swap.entry.options[0]);
        currentForSwap = userPickId || defaultPlaceId;
        const optionIds = swap.entry.options || [];
        // Sort: current first, then favourites, then options, then rest
        swapCandidates = [...swapCandidates].sort((a, b) => {
          const sa = a.id === currentForSwap ? -100 : (favourites.has(a.id) ? -50 : (optionIds.includes(a.id) ? -10 : 0));
          const sb = b.id === currentForSwap ? -100 : (favourites.has(b.id) ? -50 : (optionIds.includes(b.id) ? -10 : 0));
          return sa - sb;
        });
      }

      return (
        <>
          <div className="scrim" data-open={open} onClick={onClose} />
          <aside className="sheet" data-open={open} aria-hidden={!open}>
            {place && (
              <>
                <div style={{ position: "relative" }}>
                  {place.img && <PlaceImg src={place.img} alt={place.name} name={place.name} />}
                  {onToggleFavourite && place.id && PLACES[place.id] && (
                    <button className="fav-btn" onClick={() => onToggleFavourite(place.id)}
                            aria-label={favourites.has(place.id) ? "Remove from favourites" : "Add to favourites"}>
                      {favourites.has(place.id) ? <span style={{ color: "var(--coral)" }}>♥</span> : <span style={{ color: "var(--ink-mute)" }}>♡</span>}
                    </button>
                  )}
                </div>
                <div className="p-6">
                  <button className="text-xs ink-soft mono mb-4" onClick={onClose}>← close</button>
                  <div className="text-xs ink-mute">{place.category}</div>
                  <h2 className="serif text-3xl teal mt-1">{place.name}</h2>
                  {place.blurb && <p className="mt-3 ink-soft leading-relaxed">{place.blurb}</p>}
                  <div className="mt-5 grid grid-cols-1 gap-3 text-sm">
                    {place.address && <Row label="Address"><a href={url(place.address)} target="_blank" rel="noreferrer" className="teal link-underline">{place.address}</a></Row>}
                    {place.hours && <Row label="Hours">{place.hours}</Row>}
                    {place.phone && <Row label="Phone"><a href={`tel:${place.phone.replace(/\s+/g, '')}`} className="teal link-underline">{place.phone}</a></Row>}
                    {place.website && <Row label="Website"><a href={place.website} target="_blank" rel="noreferrer" className="teal link-underline">{place.website.replace(/^https?:\/\//, '').replace(/\/$/, '')}</a></Row>}
                    {place.ticket && <Row label="Tickets">{place.ticket}</Row>}
                    {place.duration && <Row label="Duration">{place.duration}</Row>}
                    {place.fromBase && <Row label="From the Airbnb">{place.fromBase}</Row>}
                  </div>
                  {place.booking && (
                    <div className="mt-5 card p-4 bg-coral-soft border-line">
                      <div className="text-[11px] uppercase tracking-widest font-semibold mb-1" style={{ color: "var(--teal-deep)" }}>Booking</div>
                      <div className="ink text-sm">{place.booking}</div>
                    </div>
                  )}
                  {(place.order || place.kidNote) && (
                    <div className="mt-3 space-y-3">
                      {place.order && (
                        <div className="card p-4 bg-cream-deep border-line">
                          <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mb-1">What to order / do</div>
                          <div className="ink text-sm">{place.order}</div>
                        </div>
                      )}
                      {place.kidNote && (
                        <div className="card p-4 bg-sage-soft border-line">
                          <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mb-1">Kids</div>
                          <div className="ink text-sm">{place.kidNote}</div>
                        </div>
                      )}
                    </div>
                  )}
                  <div className="mt-5 flex flex-wrap gap-2">
                    <a href={`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(place.name + " Wellington")}`} target="_blank" rel="noreferrer" className="chip" style={{ background: "var(--cream-deep)" }}>more photos →</a>
                    {place.website && <a href={place.website} target="_blank" rel="noreferrer" className="chip" style={{ background: "var(--cream-deep)" }}>visit website →</a>}
                  </div>
                </div>
              </>
            )}
            {swap && (
              <div className="p-6">
                <button className="text-xs ink-soft mono mb-4" onClick={onClose}>← close</button>
                <div className="text-[11px] uppercase tracking-widest ink-mute font-semibold mono">Swap · {swap.entry.time}</div>
                <h2 className="serif text-2xl teal mt-1">{swap.entry.title}</h2>
                <p className="text-sm ink-soft mt-1">
                  {swapCandidates.length} options. Tap one to lock it in. Favourites at the top.
                </p>
                <div className="mt-4 grid grid-cols-1 gap-3">
                  {swapCandidates.map(p => (
                    <PlaceCard key={p.id} place={p} small selected={p.id === currentForSwap}
                      isFavourite={favourites.has(p.id)} onToggleFavourite={onToggleFavourite}
                      onOpen={(pl) => { onPickForEntry(swap.entry.id, pl.id); onOpen({ type: "place", place: pl }); }} />
                  ))}
                </div>
              </div>
            )}
          </aside>
        </>
      );
    }

    function Row({ label, children }) {
      return (
        <div className="grid grid-cols-[110px_1fr] gap-3 items-start">
          <div className="text-[11px] uppercase tracking-widest ink-mute font-semibold pt-0.5">{label}</div>
          <div className="ink">{children}</div>
        </div>
      );
    }

    /* ================================================================ */
    /* PACKING CHECKLIST                                                   */
    /* ================================================================ */

    function PackingChecklist({ checked, onToggle, onReset }) {
      const totalItems = PACKING_LIST.reduce((sum, g) => sum + g.items.length, 0);
      const doneCount = PACKING_LIST.reduce((sum, g) => sum + g.items.filter(i => checked.has(i.id)).length, 0);
      const pct = Math.round((doneCount / totalItems) * 100);
      return (
        <section>
          <div className="flex items-baseline justify-between mb-3">
            <h3 className="serif text-2xl teal">Packing checklist</h3>
            <button onClick={onReset} className="text-xs ink-soft link-underline">Reset all</button>
          </div>
          <div className="card p-3 mb-4 bg-cream-deep border-line">
            <div className="flex items-center justify-between text-sm">
              <span className="ink"><span className="font-semibold">{doneCount}</span> / {totalItems} packed</span>
              <span className="mono text-xs ink-soft">{pct}%</span>
            </div>
            <div style={{ height: 6, background: "rgba(0,0,0,0.06)", borderRadius: 999, marginTop: 8, overflow: "hidden" }}>
              <div style={{ width: `${pct}%`, height: "100%", background: "var(--teal)", transition: "width 200ms" }} />
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {PACKING_LIST.map((g, i) => {
              const groupDone = g.items.filter(it => checked.has(it.id)).length;
              return (
                <div key={i} className="card p-5">
                  <div className="flex items-baseline justify-between mb-2">
                    <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">{g.group}</div>
                    <span className="text-xs ink-mute mono">{groupDone}/{g.items.length}</span>
                  </div>
                  <div>
                    {g.items.map(item => {
                      const isDone = checked.has(item.id);
                      return (
                        <label key={item.id} className={`checkitem ${isDone ? "done" : ""}`}>
                          <input type="checkbox" checked={isDone} onChange={() => onToggle(item.id)} />
                          <span className="label text-sm ink">{item.label}</span>
                        </label>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    /* ================================================================ */
    /* TODO LIST                                                            */
    /* ================================================================ */

    function TodoList({ todos, onToggle, onAdd, onRemove }) {
      const [input, setInput] = useState("");
      const submit = (e) => {
        e.preventDefault();
        const text = input.trim();
        if (!text) return;
        onAdd(text);
        setInput("");
      };
      const doneCount = todos.filter(t => t.done).length;
      return (
        <section>
          <div className="flex items-baseline justify-between mb-3">
            <h3 className="serif text-2xl teal">To-do</h3>
            <span className="text-xs ink-mute mono">{doneCount}/{todos.length} done</span>
          </div>
          <div className="card p-5">
            <form onSubmit={submit} className="flex gap-2 mb-4">
              <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Add a new task…"
                className="flex-1 px-3 py-2 rounded-md border border-line bg-white text-sm" />
              <button type="submit" className="px-4 py-2 rounded-md bg-teal text-cream text-sm font-semibold">Add</button>
            </form>
            <div>
              {todos.map(t => (
                <div key={t.id} className={`checkitem ${t.done ? "done" : ""}`}>
                  <input type="checkbox" checked={t.done} onChange={() => onToggle(t.id)} />
                  <span className="label text-sm ink flex-1">{t.text}</span>
                  <button onClick={() => onRemove(t.id)} className="text-xs ink-mute hover:ink-soft" title="Remove">✕</button>
                </div>
              ))}
              {todos.length === 0 && <div className="text-sm ink-mute py-4 text-center">No tasks yet.</div>}
            </div>
          </div>
        </section>
      );
    }

    /* ================================================================ */
    /* LOGISTICS PAGE                                                       */
    /* ================================================================ */

    function LogisticsCard({ label, title, body, sub, href }) {
      const Wrap = href ? "a" : "div";
      const props = href ? { href, target: "_blank", rel: "noreferrer", className: "card p-5 block clickable" } : { className: "card p-5" };
      return (
        <Wrap {...props}>
          <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">{label}</div>
          <div className="serif text-xl mt-1 teal">{title}</div>
          <div className="mt-2 text-sm ink">{body}</div>
          {sub && <div className="mt-2 text-xs ink-soft">{sub}</div>}
        </Wrap>
      );
    }

    function LogisticsPage({ packingChecked, onTogglePacking, onResetPacking, todos, onToggleTodo, onAddTodo, onRemoveTodo }) {
      return (
        <section>
          <div className="mb-6"><h2 className="serif text-3xl teal">Logistics</h2></div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <LogisticsCard label="Outbound flight · Fri 29 May"
              title={`${FLIGHTS.out.code} · ${FLIGHTS.out.from} → ${FLIGHTS.out.to}`}
              body={`${FLIGHTS.out.dep} → ${FLIGHTS.out.arr} · 1h10m`}
              sub="Bag drop closes 07:40. Aim to land Car Park O 07:00." />
            <LogisticsCard label="Return flight · Mon 1 Jun"
              title={`${FLIGHTS.back.code} · ${FLIGHTS.back.from} → ${FLIGHTS.back.to}`}
              body={`${FLIGHTS.back.dep} → ${FLIGHTS.back.arr} · 1h5m`}
              sub="Bag drop closes 09:35. Drop car back 08:35." />
            <LogisticsCard label="Rental car" title={CAR.vehicle}
              body={`Reg ${CAR.reg} · ${CAR.pickup} → ${CAR.dropoff}`} sub={CAR.cost} />
            <LogisticsCard label="Airbnb" title="219 Rintoul Street, Berhampore"
              body={`Hosted by ${STAY.host} · Check-in ${STAY.checkin} · Checkout ${STAY.checkout} · ${STAY.access}`}
              sub="10 min drive to airport · 5 min drive to Wellington Zoo · 4 min drive to New World Newtown."
              href={url(STAY.mapQ)} />
          </div>

          <div className="mt-8">
            <h3 className="serif text-2xl teal mb-3">Airbnb — house rules + listing</h3>
            <div className="card p-5">
              <div className="flex flex-wrap items-center gap-3 mb-4">
                <a href={STAY.listing} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-md bg-teal text-cream text-sm font-semibold">Open Airbnb listing →</a>
                <a href={url(STAY.mapQ)} target="_blank" rel="noreferrer" className="text-sm teal link-underline">View on Maps</a>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3 text-sm">
                {STAY.rules.map((r, i) => (
                  <div key={i}>
                    <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">{r.label}</div>
                    <div className="ink mt-0.5">{r.text}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="mt-8">
            <h3 className="serif text-2xl teal mb-3">Torbay to Auckland Domestic Airport · Friday</h3>
            <div className="card p-5">
              <div className="text-sm ink-soft mb-3">14 Tui Street, Torbay → Car Park O, AKL Domestic terminal (5 min walk). ~60 min drive.</div>
              <ol className="space-y-2 text-sm">
                {[
                  ["05:15", "Adults alarm"], ["05:30", "Boys up · breakfast + dressed"],
                  ["05:50", "Final pack — bags by door"], ["06:00", "Leave Tui St"],
                  ["07:00", "Arrive Car Park O · walk to terminal"],
                  ["07:10", "Inside terminal · Air NZ check-in"],
                  ["07:20", "Coffee + toilet stop"], ["07:40", "Bag drop closes"],
                  ["07:50", "Boarding"], ["08:10", "NZ409 departs"],
                ].map(([t, what]) => (
                  <li key={t} className="grid grid-cols-[70px_1fr] gap-3">
                    <span className="mono text-sm" style={{ color: "var(--teal-deep)" }}>{t}</span>
                    <span className="ink">{what}</span>
                  </li>
                ))}
              </ol>
            </div>
          </div>

          <div className="mt-8">
            <h3 className="serif text-2xl teal mb-3">Airbnb to Wellington Airport · Monday</h3>
            <div className="card p-5">
              <div className="text-sm ink-soft mb-3">219 Rintoul St → WLG Airport · ~15 min · drop car back by 08:35.</div>
              <ol className="space-y-2 text-sm">
                {[
                  ["06:00", "Adults alarm"], ["06:30", "Boys up"],
                  ["07:00", "Breakfast at Airbnb"], ["08:00", "Final tidy + bags to car"],
                  ["08:15", "Leave Airbnb"], ["08:35", "Drop RAV4"],
                  ["08:55", "Air NZ check-in"], ["09:30", "Through security"],
                  ["09:35", "Bag drop closes (last call)"],
                  ["09:45", "Boarding"], ["10:05", "NZ422 departs"],
                ].map(([t, what]) => (
                  <li key={t} className="grid grid-cols-[70px_1fr] gap-3">
                    <span className="mono text-sm" style={{ color: "var(--teal-deep)" }}>{t}</span>
                    <span className="ink">{what}</span>
                  </li>
                ))}
              </ol>
            </div>
          </div>

          <div className="mt-10">
            <TodoList todos={todos} onToggle={onToggleTodo} onAdd={onAddTodo} onRemove={onRemoveTodo} />
          </div>

          <div className="mt-10">
            <PackingChecklist checked={packingChecked} onToggle={onTogglePacking} onReset={onResetPacking} />
          </div>
        </section>
      );
    }

    /* ================================================================ */
    /* FOOD + ACTIVITIES PAGES                                              */
    /* ================================================================ */

    function ChipRow({ label, value, setValue, options }) {
      return (
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-[11px] uppercase tracking-widest ink-mute font-semibold mono w-16 shrink-0">{label}</span>
          <div className="flex flex-wrap gap-2">
            {options.map(o => <button key={o.v} className="chip" data-active={String(value) === String(o.v)} onClick={() => setValue(o.v)}>{o.l}</button>)}
          </div>
        </div>
      );
    }

    function FoodPage({ onOpen, favourites, onToggleFavourite }) {
      const all = Object.values(PLACES).filter(p => p.meal);
      const [meal, setMeal] = useState("all");
      const [cuisine, setCuisine] = useState("all");
      const [price, setPrice] = useState("all");
      const [kids, setKids] = useState(false);
      const [favsOnly, setFavsOnly] = useState(false);
      const cuisines = ["all", ...Array.from(new Set(all.map(p => p.cuisine)))];
      let filtered = all.filter(p => {
        if (meal !== "all" && !p.meal.includes(meal)) return false;
        if (cuisine !== "all" && p.cuisine !== cuisine) return false;
        if (price !== "all" && p.price !== Number(price)) return false;
        if (kids && !p.kidFriendly) return false;
        if (favsOnly && !favourites.has(p.id)) return false;
        return true;
      });
      filtered = sortByFavourites(filtered, favourites);
      return (
        <section>
          <div className="mb-4">
            <h2 className="serif text-3xl teal">Food</h2>
            <p className="text-sm ink-soft mt-1">{filtered.length} of {all.length} places · favourites pinned to the top.</p>
          </div>
          <div className="space-y-3 mb-6">
            <ChipRow label="Meal" value={meal} setValue={setMeal} options={[
              { v: "all", l: "All" }, { v: "breakfast", l: "Breakfast" },
              { v: "lunch", l: "Lunch" }, { v: "dinner", l: "Dinner" }, { v: "drinks", l: "Drinks" } ]} />
            <ChipRow label="Cuisine" value={cuisine} setValue={setCuisine} options={cuisines.map(c => ({ v: c, l: c === "all" ? "All" : c }))} />
            <ChipRow label="Price" value={price} setValue={setPrice} options={[
              { v: "all", l: "All" }, { v: "1", l: "$" }, { v: "2", l: "$$" }, { v: "3", l: "$$$" }, { v: "4", l: "$$$$" } ]} />
            <div className="flex gap-2 flex-wrap">
              <button className="chip" data-active={kids} onClick={() => setKids(!kids)}>kid-friendly only</button>
              <button className="chip" data-active={favsOnly} onClick={() => setFavsOnly(!favsOnly)}>♥ favourites only</button>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(p => <PlaceCard key={p.id} place={p}
              isFavourite={favourites.has(p.id)} onToggleFavourite={onToggleFavourite}
              onOpen={(pl) => onOpen({ type: "place", place: pl })} />)}
          </div>
        </section>
      );
    }

    function ActivitiesPage({ onOpen, favourites, onToggleFavourite }) {
      const all = Object.values(PLACES).filter(p => p.kind === "activity");
      const [tag, setTag] = useState("all");
      const [favsOnly, setFavsOnly] = useState(false);
      const tags = ["all", ...Array.from(new Set(all.flatMap(p => p.tags)))];
      let filtered = all.filter(p => {
        if (tag !== "all" && !p.tags.includes(tag)) return false;
        if (favsOnly && !favourites.has(p.id)) return false;
        return true;
      });
      filtered = sortByFavourites(filtered, favourites);
      return (
        <section>
          <div className="mb-4">
            <h2 className="serif text-3xl teal">Activities</h2>
            <p className="text-sm ink-soft mt-1">{filtered.length} of {all.length} options · favourites pinned.</p>
          </div>
          <div className="mb-6 space-y-3">
            <ChipRow label="Tag" value={tag} setValue={setTag} options={tags.map(t => ({ v: t, l: t === "all" ? "All" : t }))} />
            <div><button className="chip" data-active={favsOnly} onClick={() => setFavsOnly(!favsOnly)}>♥ favourites only</button></div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filtered.map(p => <PlaceCard key={p.id} place={p}
              isFavourite={favourites.has(p.id)} onToggleFavourite={onToggleFavourite}
              onOpen={(pl) => onOpen({ type: "place", place: pl })} />)}
          </div>
        </section>
      );
    }

    /* ================================================================ */
    /* APP                                                                 */
    /* ================================================================ */

    function App() {
      const [view, setView] = useState("itinerary");
      const [day, setDay] = useState("fri");
      const [sheet, setSheet] = useState(null);

      const [syncStatus, setSyncStatus] = useState(sb ? "syncing" : "local-only");

      // ===== Picks =====
      const [picks, setPicks] = useState(() => {
        try { return JSON.parse(localStorage.getItem("wlg-picks-v1")) || {}; } catch { return {}; }
      });
      useEffect(() => {
        if (!sb) return;
        (async () => {
          try {
            const remote = await sbLoadPicks();
            const localKeys = Object.keys(picks);
            if (Object.keys(remote).length === 0 && localKeys.length > 0) {
              for (const [entryId, placeId] of Object.entries(picks)) await sbSetPick(entryId, placeId);
            } else if (Object.keys(remote).length > 0) {
              setPicks(remote);
              localStorage.setItem("wlg-picks-v1", JSON.stringify(remote));
            }
          } catch (e) { console.error("Supabase picks load:", e); setSyncStatus("error"); }
        })();
      }, []);
      const setPickForEntry = (entryId, placeId) => {
        const next = { ...picks, [entryId]: placeId };
        setPicks(next);
        localStorage.setItem("wlg-picks-v1", JSON.stringify(next));
        if (sb) sbSetPick(entryId, placeId).catch(e => console.error("Supabase pick save:", e));
      };
      const resetPick = (entryId) => {
        const next = { ...picks }; delete next[entryId];
        setPicks(next);
        localStorage.setItem("wlg-picks-v1", JSON.stringify(next));
        if (sb) sbResetPick(entryId).catch(e => console.error("Supabase pick reset:", e));
      };

      // ===== Favourites =====
      const [favourites, setFavourites] = useState(() => {
        try {
          const stored = localStorage.getItem("wlg-favourites-v1");
          if (stored) return new Set(JSON.parse(stored));
        } catch {}
        return new Set(FAVOURITES_DEFAULT);
      });
      useEffect(() => {
        if (!sb) return;
        (async () => {
          try {
            const remote = await sbLoadFavourites();
            if (remote.size === 0) {
              const seed = favourites.size > 0 ? [...favourites] : FAVOURITES_DEFAULT;
              if (seed.length > 0) await sbSeedFavourites(seed);
              const next = new Set(seed);
              setFavourites(next);
              localStorage.setItem("wlg-favourites-v1", JSON.stringify([...next]));
            } else {
              setFavourites(remote);
              localStorage.setItem("wlg-favourites-v1", JSON.stringify([...remote]));
            }
            setSyncStatus("synced");
          } catch (e) { console.error("Supabase favourites load:", e); setSyncStatus("error"); }
        })();
      }, []);
      const toggleFavourite = (placeId) => {
        const next = new Set(favourites);
        const wasIn = next.has(placeId);
        if (wasIn) next.delete(placeId); else next.add(placeId);
        setFavourites(next);
        localStorage.setItem("wlg-favourites-v1", JSON.stringify([...next]));
        if (sb) (wasIn ? sbRemoveFavourite(placeId) : sbAddFavourite(placeId))
          .catch(e => console.error("Supabase favourite toggle:", e));
      };

      // ===== Packing =====
      const [packingChecked, setPackingChecked] = useState(() => {
        try {
          const stored = localStorage.getItem("wlg-packing-v1");
          if (stored) return new Set(JSON.parse(stored));
        } catch {}
        return new Set();
      });
      useEffect(() => {
        if (!sb) return;
        (async () => {
          try {
            const remote = await sbLoadPacking();
            if (remote.size === 0 && packingChecked.size > 0) {
              for (const item of packingChecked) await sbSetPacking(item, true);
            } else if (remote.size > 0) {
              setPackingChecked(remote);
              localStorage.setItem("wlg-packing-v1", JSON.stringify([...remote]));
            }
          } catch (e) { console.error("Supabase packing load:", e); }
        })();
      }, []);
      const togglePacking = (itemId) => {
        const next = new Set(packingChecked);
        const wasIn = next.has(itemId);
        if (wasIn) next.delete(itemId); else next.add(itemId);
        setPackingChecked(next);
        localStorage.setItem("wlg-packing-v1", JSON.stringify([...next]));
        if (sb) sbSetPacking(itemId, !wasIn).catch(e => console.error("Supabase packing save:", e));
      };
      const resetPacking = () => {
        if (!confirm("Clear all packed-items checks?")) return;
        setPackingChecked(new Set());
        localStorage.setItem("wlg-packing-v1", JSON.stringify([]));
        if (sb) sbResetPacking().catch(e => console.error("Supabase packing reset:", e));
      };

      // ===== Todos =====
      const [todos, setTodos] = useState(() => {
        try {
          const stored = localStorage.getItem("wlg-todos-v1");
          if (stored) return JSON.parse(stored);
        } catch {}
        return TODOS_DEFAULT.map(t => ({ ...t, done: false }));
      });
      useEffect(() => {
        if (!sb) return;
        (async () => {
          try {
            const remote = await sbLoadTodos();
            if (remote.length === 0) {
              const seed = todos.length > 0 ? todos : TODOS_DEFAULT.map(t => ({ ...t, done: false }));
              if (seed.length > 0) await sbSeedTodos(seed);
              setTodos(seed);
              localStorage.setItem("wlg-todos-v1", JSON.stringify(seed));
            } else {
              setTodos(remote);
              localStorage.setItem("wlg-todos-v1", JSON.stringify(remote));
            }
          } catch (e) { console.error("Supabase todos load:", e); }
        })();
      }, []);
      const persistTodosLocal = (next) => {
        setTodos(next);
        localStorage.setItem("wlg-todos-v1", JSON.stringify(next));
      };
      const toggleTodo = (id) => {
        const next = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
        persistTodosLocal(next);
        const target = next.find(t => t.id === id);
        if (sb && target) sbUpdateTodo(id, target.done).catch(e => console.error("Supabase todo update:", e));
      };
      const addTodo = (text) => {
        const newTodo = { id: `todo-${Date.now()}`, text, done: false };
        persistTodosLocal([...todos, newTodo]);
        if (sb) sbAddTodo(newTodo).catch(e => console.error("Supabase todo add:", e));
      };
      const removeTodo = (id) => {
        persistTodosLocal(todos.filter(t => t.id !== id));
        if (sb) sbRemoveTodo(id).catch(e => console.error("Supabase todo remove:", e));
      };

      const openSheet = (payload) => setSheet(payload);
      const closeSheet = () => setSheet(null);
      const openSwap = (entry) => setSheet({ type: "swap", entry });

      const activeDay = DAYS.find(d => d.id === day);

      return (
        <div className="min-h-screen">
          <header className="border-b border-line bg-cream">
            <div className="max-w-6xl mx-auto px-6 py-8">
              <div className="flex flex-wrap items-baseline justify-between gap-4">
                <div>
                  <div className="text-[11px] uppercase tracking-widest ink-soft font-semibold mono">29 May – 1 June 2026 · King's Birthday weekend</div>
                  <h1 className="serif text-4xl md:text-5xl teal mt-1">Wellington · 4 days</h1>
                  <div className="text-sm ink-soft mt-1">Peter · Emma · Mam · Nate (5) · Cillian (2)</div>
                </div>
                <div className="no-print flex items-center gap-3">
                  <span className="text-xs ink-mute" title={`Supabase: ${syncStatus}`}>
                    {syncStatus === "synced" && <span style={{ color: "var(--sage)" }}>● synced</span>}
                    {syncStatus === "syncing" && <span style={{ color: "var(--gold)" }}>● syncing…</span>}
                    {syncStatus === "error" && <span style={{ color: "var(--coral)" }}>● offline (local only)</span>}
                    {syncStatus === "local-only" && <span style={{ color: "var(--ink-mute)" }}>● local only</span>}
                  </span>
                  <button onClick={() => window.print()} className="px-4 py-2 rounded-lg border border-line bg-white text-sm hover:bg-cream-deep">Print</button>
                </div>
              </div>
            </div>
          </header>

          <nav className="no-print sticky top-0 z-10 bg-cream border-b border-line">
            <div className="max-w-6xl mx-auto px-6 py-3 flex flex-wrap gap-2">
              {[
                ["itinerary", "Itinerary"], ["food", "Food"],
                ["activities", "Activities"], ["logistics", "Logistics + Packing"],
              ].map(([id, label]) => (
                <button key={id} data-active={view === id} className="tab-btn" onClick={() => setView(id)}>{label}</button>
              ))}
            </div>
          </nav>

          <main className="max-w-6xl mx-auto px-6 py-10">
            {view === "itinerary" && (
              <>
                <WeatherWidget />
                <div className="card p-4 mb-8 bg-sage-soft border-line">
                  <div className="text-[11px] uppercase tracking-widest font-semibold mono" style={{ color: "var(--teal-deep)" }}>Interactive</div>
                  <div className="text-sm ink mt-1">
                    Cards with <span className="px-2 py-0.5 rounded-md border border-line bg-white mono text-xs">Swap →</span> let you change the food or activity. Heart any place to favourite it — favourites pin to the top in Food + Activities. Saves on this device.
                  </div>
                </div>
                <div className="flex flex-wrap gap-2 mb-8">
                  {DAYS.map(d => (
                    <button key={d.id} data-active={day === d.id} className="tab-btn text-sm" onClick={() => setDay(d.id)}>{d.label}</button>
                  ))}
                </div>
                <Day day={activeDay} picks={picks} onOpen={openSheet} onSwap={openSwap} onResetPick={resetPick} />
              </>
            )}
            {view === "food" && <FoodPage onOpen={openSheet} favourites={favourites} onToggleFavourite={toggleFavourite} />}
            {view === "activities" && <ActivitiesPage onOpen={openSheet} favourites={favourites} onToggleFavourite={toggleFavourite} />}
            {view === "logistics" && <LogisticsPage
              packingChecked={packingChecked} onTogglePacking={togglePacking} onResetPacking={resetPacking}
              todos={todos} onToggleTodo={toggleTodo} onAddTodo={addTodo} onRemoveTodo={removeTodo} />}
          </main>

          <footer className="border-t border-line bg-cream-deep">
            <div className="max-w-6xl mx-auto px-6 py-6 text-xs ink-soft">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <span>Local file · open in any browser · last updated 18 May 2026</span>
                <span>Picks · favourites · packing · todos all save to this device.</span>
              </div>
            </div>
          </footer>

          <DetailSheet open={!!sheet} payload={sheet} onClose={closeSheet} onOpen={openSheet}
            picks={picks} onPickForEntry={setPickForEntry}
            favourites={favourites} onToggleFavourite={toggleFavourite} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
